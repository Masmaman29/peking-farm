<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR-FARM — Modern Duck Farming</title><meta name="theme-color" content="#0F3328"><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png"><link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{
  --forest:#174A3A;--dark:#0F3328;--deep:#0B241C;--sage:#7FA68C;--soft:#A8D08D;--warm:#F7F8F5;--white:#FFFFFF;--char:#1F2933;
  --gold:#C6A15B;--warn:#D99A2B;--danger:#D9534F;--ok:#2E8B57;
  --bg:#0B241C;--bg2:#10352A;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#EDF2EE;--muted:#A9B8AF;--dim:#7F8F86;
  --r:16px;--r-sm:10px;--sh:0 10px 30px rgba(0,0,0,.25);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
#root{height:100%}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--soft)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- LOGIN ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login-visual{position:relative;overflow:hidden;background:
 radial-gradient(1200px 500px at 20% 100%,rgba(168,208,141,.22),transparent 60%),
 radial-gradient(800px 400px at 90% 0%,rgba(198,161,91,.18),transparent 60%),
 linear-gradient(160deg,#0F3328,#0B241C 60%,#071a13);padding:48px;display:flex;flex-direction:column;gap:0}
.login-visual .brand{display:flex;align-items:center;gap:12px}
.login-visual h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(34px,4vw,52px);line-height:1.05;max-width:16ch}
.login-visual .tagline{color:var(--sage);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600}
.brandmark{height:44px;width:auto;display:block}
.login-visual .livebox{margin-top:36px;border:1px solid var(--line2);border-radius:16px;padding:18px 20px;background:rgba(255,255,255,.05);backdrop-filter:blur(6px)}
.login-visual .livebox .lhead{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.login-visual .livebox .lhead b{font-size:13px;letter-spacing:.02em}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.live-dot i{width:7px;height:7px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 4px rgba(168,208,141,.18)}
.live-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.live-grid div{min-width:0}
.live-grid b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.live-grid span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.live-foot{color:var(--dim);font-size:11.5px;margin-top:14px}
@media (max-width:680px){.live-grid{grid-template-columns:1fr 1fr}}
.login-visual .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.login-visual .pillar{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:14px}
.login-visual .pillar b{display:block;font-size:13px;margin-bottom:4px}
.login-visual .pillar span{color:var(--muted);font-size:12px}
.login-visual > small{margin-top:auto;padding-top:28px}
.field-art{position:absolute;inset:auto -10% -18% -10%;height:55%;pointer-events:none;opacity:.9}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg2)}
.login-card{width:100%;max-width:420px}
.login-card h2{font-size:24px;margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:24px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.role-btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);text-align:left;transition:.15s}
.role-btn:hover{background:var(--card2)}
.role-btn.active{border-color:var(--soft);background:rgba(168,208,141,.14)}
.role-btn b{font-size:13px}.role-btn small{color:var(--muted);font-size:11px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(198,161,91,.16);color:var(--gold);border:1px solid rgba(198,161,91,.35);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.06em}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100%;overflow:hidden}
.sidebar{background:linear-gradient(180deg,#0E2F25,#0A2119);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.brand b{font-size:17px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{color:var(--sage);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:var(--muted);width:100%;text-align:left;font-weight:600;font-size:13.5px;transition:.15s}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.nav button.active{background:linear-gradient(90deg,#1F5C48,#174A3A);color:#fff;box-shadow:inset 0 0 0 1px rgba(168,208,141,.25)}
.nav button .cnt{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.nav-sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 12px 4px;font-weight:700}
.ai-card{margin-top:auto;background:linear-gradient(160deg,rgba(168,208,141,.16),rgba(23,74,58,.6));border:1px solid rgba(168,208,141,.25);border-radius:16px;padding:14px}
.ai-card b{display:flex;align-items:center;gap:8px;font-size:14px}
.ai-card p{color:var(--muted);font-size:12px;margin:6px 0 10px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(11,36,28,.7);backdrop-filter:blur(8px);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:460px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted)}
.search input{background:transparent;border:0;color:var(--text);flex:1;outline:0;min-width:0}
.search kbd{font-size:10px;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--dim)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);display:grid;place-items:center}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:16px;text-align:center}
.cycle-pill,.user-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--text)}
.cycle-pill b{display:block;font-size:13px;line-height:1.1}.cycle-pill small{color:var(--muted);font-size:11px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--soft),var(--forest));display:grid;place-items:center;font-weight:800;font-size:12px;color:#0B241C}
.content{flex:1;overflow-y:auto;padding:22px 24px 40px}
.hamb{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}

/* ---------- LAYOUT PRIMITIVES ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:24px}
.page-head .desc{color:var(--muted);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-h .sub{color:var(--muted);font-size:12px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:1px solid rgba(168,208,141,.18);
 background:radial-gradient(900px 300px at 85% 0%,rgba(198,161,91,.16),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(168,208,141,.22),transparent 60%),linear-gradient(120deg,#123B2F,#0C2A21)}
.hero h1{font-size:clamp(28px,3.4vw,42px);line-height:1.05;font-family:'Fraunces',Georgia,serif;font-weight:500}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.hero .meta b{color:var(--text);font-size:18px}
.hero .art{position:absolute;right:-20px;bottom:-30px;width:420px;max-width:60%;opacity:.55;pointer-events:none}
.hero .weather{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}
.hero .weather b{font-size:20px}.hero .weather small{color:var(--muted);display:block;font-size:11px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.1;overflow-wrap:anywhere}
.kpi.gold .val{font-size:21px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .foot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:auto}
.kpi .foot.up{color:var(--soft)}.kpi .foot.down{color:var(--danger)}.kpi .foot.warn{color:var(--warn)}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:rgba(168,208,141,.14);display:grid;place-items:center;color:var(--soft)}
.kpi.gold .ic{background:rgba(198,161,91,.18);color:var(--gold)}
.kpi.red .ic{background:rgba(217,83,79,.18);color:#F08A87}
.bar{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--soft));border-radius:99px}
.bar.g i{background:linear-gradient(90deg,#A88A4A,var(--gold))}
.bar.r i{background:var(--danger)}.bar.w i{background:var(--warn)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.b-ok{background:rgba(46,139,87,.2);color:#8FD9AE}.b-warn{background:rgba(217,154,43,.2);color:#F2C46B}.b-danger{background:rgba(217,83,79,.2);color:#F29390}
.b-info{background:rgba(127,166,140,.2);color:#C5DACB}.b-gold{background:rgba(198,161,91,.2);color:#E5C98A}.b-neutral{background:rgba(255,255,255,.08);color:var(--muted)}
.b-pending{background:rgba(217,154,43,.2);color:#F2C46B}.b-approved{background:rgba(46,139,87,.2);color:#8FD9AE}.b-rejected{background:rgba(217,83,79,.2);color:#F29390}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:9px 14px;border:1px solid var(--line2);background:rgba(255,255,255,.07);color:var(--text);font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(120deg,#8FC474,#A8D08D);color:#0B241C;border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn.gold{background:var(--gold);color:#0B241C;border-color:transparent}
.btn.danger{background:rgba(217,83,79,.18);color:#F29390;border-color:rgba(217,83,79,.3)}
.btn.ok{background:rgba(46,139,87,.25);color:#9FE2BC;border-color:rgba(46,139,87,.4)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.lg{padding:14px 18px;font-size:16px;border-radius:14px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sage)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px}
.seg button.active{background:rgba(168,208,141,.2);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:#fff;border-color:var(--soft)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:10px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.r,th.r{text-align:right}
.thumb{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2E6B52,#7FA68C);display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:#0B241C}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;border:1px solid;font-size:13px}
.alert b{display:block}
.alert.warn{background:rgba(217,154,43,.12);border-color:rgba(217,154,43,.35)}
.alert.danger{background:rgba(217,83,79,.12);border-color:rgba(217,83,79,.35)}
.alert.ok{background:rgba(46,139,87,.12);border-color:rgba(46,139,87,.35)}
.alert.info{background:rgba(127,166,140,.12);border-color:rgba(127,166,140,.35)}
.attn{display:flex;flex-direction:column;gap:8px}
.attn a,.attn button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);text-decoration:none;width:100%;text-align:left;font:inherit}
.attn .dotc{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.attn .arr{margin-left:auto;color:var(--dim)}
.d-red{background:var(--danger)}.d-yel{background:var(--warn)}.d-grn{background:var(--ok)}
.timeline{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl{position:relative}
.tl:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px rgba(127,166,140,.25)}
.tl.done:before{background:var(--soft)}.tl.now:before{background:var(--gold);box-shadow:0 0 0 3px rgba(198,161,91,.3)}.tl.todo:before{background:#3B4F46}
.tl .t{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.tl .b{font-weight:700}.tl .d{color:var(--muted);font-size:12.5px}
.stage{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stage div{padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:center;font-weight:700;font-size:12px}
.stage div small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
.stage .done{border-color:rgba(168,208,141,.4);background:rgba(168,208,141,.12)}
.stage .now{border-color:var(--gold);background:rgba(198,161,91,.14)}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;line-height:1}.ring .c small{color:var(--muted);font-size:11px}
.brk{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.brk div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:center}
.brk .bar{grid-column:1/-1}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .n{text-align:center}.flow .n b{display:block;font-size:22px}.flow .n small{color:var(--muted);font-size:11px}
.flow .op{color:var(--dim);font-size:20px;font-weight:700}
.flow .n.neg b{color:#F29390}.flow .n.res b{color:var(--soft)}
.form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--text);width:100%;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--soft)}
.f select option{background:#123B2F;color:#fff}
.f .ro{background:rgba(255,255,255,.03);color:var(--muted)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.upload{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:rgba(255,255,255,.03)}
.upload.has{border-style:solid;border-color:var(--soft);color:var(--text);background:rgba(168,208,141,.1)}
.err{color:#F29390;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(3,14,10,.7);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:#10352A;border:1px solid var(--line2);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:16px}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#10352A;border-left:1px solid var(--line2);z-index:70;display:flex;flex-direction:column;animation:slide .2s;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer .db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line)}

.mob{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;width:100%;background:var(--bg)}
